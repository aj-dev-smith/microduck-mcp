# resident.toml — not a soccer player: an inhabitant.
#
# The machine that runs while a mind LIVES in the duck. Mostly it rests and
# occasionally looks around; the point is the WAKE NODES — ocarina's wake,
# ported (see ~/Code/ocarina MACHINE.md; machine.py's docstring for the
# robot adaptation). Entering a node that declares `wake = "..."` parks a
# wake pack on the sim server (reason + sensed-digest snapshot + event
# tail); the mind listens with a blocking call:
#
#     duck machine load machines/resident.toml
#     duck machine arm --block-s 300      # arm, then block until woken
#     duck machine wait --block-s 300     # ...and keep listening
#
# A robot cannot freeze like a paused game, so a wake node's own behavior is
# the holding pattern while the mind thinks, and its deadline transition
# (guarded on elapsed_s) is the default that runs if no answer ever comes.
# Autonomous-first, mind-optional — the machine never NEEDS the mind, it
# just knows what deserves one.

[machine]
name = "resident"
initial = "rest"

# The fall reflex — body first, mind second. A fall used to wake Claude from
# the floor immediately; now the sitstand slot holds an actual getup policy
# (and duck_policy can swap in a better one without a restart), so the
# machine spends two honest stand attempts before it calls anyone. The
# exclusion list is every node of the recovery path: re-firing this reflex
# mid-recovery would reset the attempt counter forever.
[[machine.transition]]
when = "not upright and elapsed_s > 0.5 and node != 'fallen' and node != 'second_try' and node != 'down' and node != 'parked'"
to = "fallen"

[[node]]
name = "rest"
behavior = "idle"
[[node.transition]]
when = "ball_seen.visible and ball_seen.age_s < 0.4"
to = "ball_spotted"
[[node.transition]]                 # boredom: glance around the room
when = "elapsed_s > 45.0"
to = "look_around"

[[node]]
name = "look_around"
behavior = "search_ball"            # a scan is just the search turn —
[node.params]                       # wz below ~1.2 is a dead zone, so the
wz = 1.5                            # glance is a brisk one
[[node.transition]]
when = "ball_seen.visible and ball_seen.age_s < 0.4"
to = "ball_spotted"
[[node.transition]]
when = "elapsed_s > 5.0"
to = "rest"

[[node]]
name = "ball_spotted"
behavior = "idle"                   # stand and look at it: the holding pattern
emote = "perk_up"                   # ...and visibly notice it first: the
                                    # startle plays while the wake goes out,
                                    # so watching the duck tells you the mind
                                    # is being called before any answer comes
wake = "ball sighted — what do we do with it?"
[[node.transition]]                 # the deadline default: lost interest
when = "elapsed_s > 300.0"
to = "rest"
[[node.transition]]                 # it left before the mind answered
when = "not ball_seen.visible and ball_seen.age_s > 10.0"
to = "rest"

[[node]]
name = "watch_ball"
behavior = "idle"
# The mind's parking answer to ball_spotted (`duck machine force watch_ball`):
# acknowledged, keep an eye on it, don't wake me for the same ball again.
[[node.transition]]
when = "not ball_seen.visible and ball_seen.age_s > 10.0"
to = "rest"

# Attempt one. `trick` fires the sitstand policy once on entry; a refusal
# (policy busy) never satisfies the upright guard, which is what the 8 s
# deadline is for. The 1.5 s floor on the success guard is so a duck that
# is merely mid-tumble through vertical doesn't count as recovered.
[[node]]
name = "fallen"
behavior = "trick"
[node.params]
trick = "stand"
[[node.transition]]
when = "upright and elapsed_s > 1.5"
to = "recovered"
[[node.transition]]
when = "elapsed_s > 8.0"
to = "second_try"

# Attempt two — a fresh node is a fresh trick firing. Two attempts, not
# three: the current policy either rises inside a second or is parked in a
# pose it will hold all day (the lean basin — see the meta-repo's
# standup-reward-surgery note), so a third try buys nothing but delay
# before the mind hears about it.
[[node]]
name = "second_try"
behavior = "trick"
[node.params]
trick = "stand"
[[node.transition]]
when = "upright and elapsed_s > 1.5"
to = "recovered"
[[node.transition]]
when = "elapsed_s > 8.0"
to = "down"

# Getting up is worth noticing: the same visible-acknowledgment rule as
# ball_spotted. The body saved itself and says so, then goes back to work.
[[node]]
name = "recovered"
behavior = "idle"
emote = "perk_up"
[[node.transition]]
when = "elapsed_s > 2.0"
to = "rest"

# NOW the mind gets called — with what was already tried, so the wake reads
# as a handoff rather than an alarm. External rescue (a reset, a brain swap
# followed by someone commanding stand) satisfies the upright guard here
# too, so an answered wake resumes the residency without a re-arm.
[[node]]
name = "down"
behavior = "idle"
wake = "down — two stand attempts failed; duck_reset, or duck_policy swap a better sitstand brain and trick stand"
[[node.transition]]
when = "upright and elapsed_s > 1.5"
to = "recovered"
[[node.transition]]                 # deadline default: park quietly
when = "elapsed_s > 300.0"
to = "parked"

[[node]]
name = "parked"
behavior = "idle"
# Terminal, and deliberately NOT a wake node: the `down` wake already went
# out, and the global fall reflex excludes this park. Still watching for a
# rescue, though — a parked duck that gets stood up rejoins the residency.
[[node.transition]]
when = "upright and elapsed_s > 1.5"
to = "recovered"
